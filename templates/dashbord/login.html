{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — MOLA TECH Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #a33a13;
            --primary-light: #ff9a6b;
            --primary-dark: #7a2a0e;
            --primary-rgb: 163, 58, 19;
            --gradient: linear-gradient(135deg, #a33a13 0%, #d65a1f 50%, #ff9a6b 100%);
            --text: #1e2230;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1d26 0%, #2a1a14 50%, #3a1f14 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        /* Ambient background orbs */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            pointer-events: none;
        }
        body::before {
            width: 500px; height: 500px;
            background: var(--primary);
            top: -15%;
            left: -10%;
        }
        body::after {
            width: 400px; height: 400px;
            background: var(--primary-light);
            bottom: -15%;
            right: -10%;
        }

        .login-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            padding: 44px 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
        }

        .login-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 30px;
            justify-content: center;
        }
        .login-brand-logo {
            width: 56px; height: 56px;
            border-radius: 16px;
            background: var(--gradient);
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 26px;
            box-shadow: 0 8px 24px rgba(var(--primary-rgb), 0.4);
        }
        .login-brand-text {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 1px;
        }
        .login-brand-text span { color: var(--primary); }
        .login-brand-text small {
            display: block;
            font-size: 10px;
            color: var(--text-light);
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .login-title {
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 6px;
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .login-sub {
            text-align: center;
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 28px;
        }

        .login-error {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #991b1b;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 20px;
        }
        .login-error i { font-size: 14px; }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i.input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 13px;
            pointer-events: none;
        }
        .input-wrap input {
            width: 100%;
            padding: 13px 16px 13px 44px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            color: var(--text);
            background: #fafbfc;
            transition: var(--transition);
            outline: none;
        }
        .input-wrap input:focus {
            border-color: var(--primary-light);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(var(--primary-rgb), 0.1);
        }
        .toggle-pass {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 13px;
            padding: 4px;
        }
        .toggle-pass:hover { color: var(--primary); }

        .login-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: var(--gradient);
            color: #fff;
            border: none;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(var(--primary-rgb), 0.35);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(var(--primary-rgb), 0.45);
        }
        .login-btn:active { transform: translateY(0); }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-light);
        }
        .login-footer a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }
        .login-footer a:hover { text-decoration: underline; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            justify-content: center;
            width: 100%;
            text-decoration: none;
            transition: var(--transition);
        }
        .back-link:hover { color: #fff; }

        @media (max-width: 480px) {
            .login-card { padding: 32px 24px; border-radius: 20px; }
            .login-title { font-size: 20px; }
            .login-brand-logo { width: 48px; height: 48px; font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-brand">
            <div class="login-brand-logo">M</div>
            <div class="login-brand-text">
                MOLA <span>TECH</span>
                <small>Admin Panel</small>
            </div>
        </div>

        <h1 class="login-title">Welcome Back</h1>
        <p class="login-sub">Sign in to access your dashboard</p>

        {% if error %}
        <div class="login-error">
            <i class="fas fa-exclamation-circle"></i>
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="{% url 'portfolio:login' %}">
            {% csrf_token %}
            {% if request.GET.next %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% endif %}

            <div class="form-group">
                <label for="id_username">Username</label>
                <div class="input-wrap">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="id_username" name="username"
                           placeholder="Enter your username" required autofocus
                           autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="id_password">Password</label>
                <div class="input-wrap">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="id_password" name="password"
                           placeholder="Enter your password" required
                           autocomplete="current-password">
                    <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i>
                Sign In
            </button>
        </form>

        <div class="login-footer">
            Forgot your password? Contact your administrator.
        </div>
    </div>

    <a href="{% url 'portfolio:index' %}" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to website
    </a>
</div>

<script>
    // Toggle password visibility
    const toggleBtn = document.getElementById('togglePass');
    const passInput = document.getElementById('id_password');
    if (toggleBtn && passInput) {
        toggleBtn.addEventListener('click', function () {
            const isPassword = passInput.type === 'password';
            passInput.type = isPassword ? 'text' : 'password';
            this.querySelector('i').className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
        });
    }
</script>

</body>
</html>
